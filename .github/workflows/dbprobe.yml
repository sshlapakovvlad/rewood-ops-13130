name: dbprobe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo ip=$(curl -s -m 10 https://api.ipify.org)
          echo "== mysql 3306 =="; timeout 8 bash -c 'exec 3<>/dev/tcp/141.8.192.100/3306; head -c 40 <&3 | xxd' || echo fail
          echo "== pg 5432 =="; PGPASSWORD=x timeout 8 psql -h 141.8.192.100 -U postgres -d postgres -w -c 'select 1' 2>&1 | tail -2 || echo fail
          echo "== ssh 22 =="; timeout 8 bash -c 'exec 3<>/dev/tcp/141.8.192.100/22; head -1 <&3' || echo fail
          echo "== http 80 =="; curl -s -m 10 -o /dev/null -w '%{http_code}\n' -H 'Host: rewood-mebel.ru' http://141.8.192.100/ || true
